<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de Materiales</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#17212b}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{width:245px;background:#102a43;color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:10px;padding:5px 10px 25px}.logo{width:42px;height:42px;border-radius:12px;background:#1f7ae0;display:grid;place-items:center;font-weight:800}.brand b{display:block;font-size:14px}.brand strong{display:block;font-size:18px}.nav button{width:100%;border:0;background:transparent;color:#c9d6e2;text-align:left;padding:12px 14px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#1f7ae0;color:white}.sidefoot{position:absolute;bottom:18px;left:25px;color:#a9bbca;font-size:12px}.main{margin-left:245px;width:calc(100% - 245px);padding:28px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0;color:#68798a}.badge{background:#e8f3ff;color:#1769aa;padding:8px 12px;border-radius:20px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:#fff;border:1px solid #e1e7ec;border-radius:14px;box-shadow:0 2px 8px #00000008}.card{padding:20px}.muted{color:#738394}.metric{font-size:27px;font-weight:750;margin-top:7px}.panel{margin-top:18px;padding:20px}.panelhead{display:flex;justify-content:space-between;align-items:center}.panel h2{margin:0 0 6px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea,.toolbar input{border:1px solid #ccd5dd;border-radius:8px;padding:10px;background:white}.tw{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{margin-top:15px;display:flex;gap:10px}.primary,.secondary{border:0;border-radius:8px;padding:11px 15px}.primary{background:#1769aa;color:#fff}.secondary{background:#edf2f6;color:#244057}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 10px;border-bottom:1px solid #edf0f2;text-align:left;white-space:nowrap}.table th{background:#f8fafb;color:#607286}.code{font-family:Consolas,monospace;font-weight:650}.negative{color:#c62828}.toast{margin:0 0 15px;padding:11px 14px;border-radius:8px;background:#e8f5e9;color:#1b5e20}.toast.err{background:#ffebee;color:#b71c1c}.empty{padding:30px;text-align:center;color:#7a8996}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a43,#1769aa)}.login-card{width:min(430px,92vw);background:#fff;border-radius:18px;padding:30px;box-shadow:0 18px 60px #0004}.login-card h1{margin:0 0 6px}.login-card p{color:#738394}.login-card .field{margin:14px 0}.login-actions{display:flex;gap:10px;margin-top:18px}.login-actions button{flex:1}.userbox{margin-top:15px;padding:12px;background:#0c2135;border-radius:10px;color:#b9c9d7;font-size:12px}
@media(max-width:900px){.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px);padding:20px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{position:static;width:100%;height:auto}.app{display:block}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.sidefoot{display:none}.main{margin:0;width:100%}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.tw{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script src="codes1.js"></script><script src="codes2.js"></script><script src="codes3.js"></script><script src="codes4.js"></script><script src="data.js"></script><script>
(()=>{const SUPA_URL='https://hkyljolbuprghkvibegs.supabase.co',SUPA_KEY='sb_publishable_OtnKQuARIoAg39KCf09dtA_PFm5bqoX',supabase=window.supabase.createClient(SUPA_URL,SUPA_KEY);const D={codes:[...window.CODES_PART_1,...window.CODES_PART_2,...window.CODES_PART_3,...window.CODES_PART_4],...window.INITIAL_DATA};let ingresos=[],salidas=[],view='dashboard',q='',notice='',user=null,loading=false,recoveryMode=false;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),num=n=>Number(n||0).toLocaleString('es-PE',{maximumFractionDigits:2}),catalog=c=>D.codes.find(x=>x.codigo===c)||{codigo:c,descripcion:'',unidad:''},stockMap=()=>{const m={};for(const x of ingresos)m[x.codigo]=(m[x.codigo]||0)+Number(x.cantidad||0);for(const x of salidas)m[x.codigo]=(m[x.codigo]||0)-Number(x.cantidad||0);return m};function field(l,n,v='',t='text',e=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${e}></div>`}function table(rows,cols){if(!rows.length)return '<div class="empty">No hay registros.</div>';return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(x=>`<th>${x[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(x=>`<td>${x[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function opts(){return D.codes.slice(0,6000).map(x=>`<option value="${esc(x.codigo)}">${esc(x.descripcion)}</option>`).join('')}function nav(){return [['dashboard','Panel','⌂'],['inventory','Inventario','▦'],['in','Ingresos','↓'],['out','Salidas','↑'],['catalog','Materiales','◫'],['reports','Reportes','▤']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="CM.go('${x[0]}')">${x[2]} &nbsp; ${x[1]}</button>`).join('')}function content(){const sm=stockMap(),rows=D.codes.map(c=>({...c,saldo:sm[c.codigo]||0})),filtered=rows.filter(x=>!q||x.codigo.toLowerCase().includes(q.toLowerCase())||x.descripcion.toLowerCase().includes(q.toLowerCase()));if(view==='dashboard')return `<div class="cards"><div class="card"><div class="muted">Materiales en catálogo</div><div class="metric">${num(D.codes.length)}</div></div><div class="card"><div class="muted">Ingresos</div><div class="metric">${num(ingresos.length)}</div></div><div class="card"><div class="muted">Salidas</div><div class="metric">${num(salidas.length)}</div></div><div class="card"><div class="muted">Unidades en stock</div><div class="metric">${num(Object.values(sm).reduce((a,b)=>a+b,0))}</div></div></div><div class="panel"><div class="panelhead"><div><h2>Inventario</h2><p class="muted">Datos sincronizados con Supabase.</p></div><button class="secondary" onclick="CM.go('inventory')">Ver inventario</button></div>${table(rows.filter(x=>x.saldo!==0).slice(0,12),[['Código',r=>`<span class="code">${esc(r.codigo)}</span>`],['Descripción',r=>esc(r.descripcion)],['Unidad',r=>esc(r.unidad)],['Stock',r=>`<b>${num(r.saldo)}</b>`]])}</div>`;if(view==='inventory')return `<div class="toolbar"><input placeholder="Buscar código o descripción..." value="${esc(q)}" oninput="CM.search(this.value)"></div><div class="panel">${table(filtered.filter(x=>x.saldo!==0||q).slice(0,300),[['Código',r=>`<span class="code">${esc(r.codigo)}</span>`],['Descripción',r=>esc(r.descripcion)],['Unidad',r=>esc(r.unidad)],['Entradas',r=>num(ingresos.filter(x=>x.codigo===r.codigo).reduce((a,x)=>a+Number(x.cantidad||0),0))],['Salidas',r=>num(salidas.filter(x=>x.codigo===r.codigo).reduce((a,x)=>a+Number(x.cantidad||0),0))],['Stock',r=>`<b class="${r.saldo<0?'negative':''}">${num(r.saldo)}</b>`]])}</div>`;if(view==='catalog')return `<div class="toolbar"><input placeholder="Buscar entre ${num(D.codes.length)} materiales..." value="${esc(q)}" oninput="CM.search(this.value)"></div><div class="panel"><div class="muted">Catálogo de ${num(D.codes.length)} materiales.</div>${table(filtered.slice(0,300),[['Código',r=>`<span class="code">${esc(r.codigo)}</span>`],['Descripción',r=>esc(r.descripcion)],['Unidad',r=>esc(r.unidad)]])}</div>`;if(view==='in')return formIn();if(view==='out')return formOut(sm);return `<div class="panel"><h2>Reportes</h2><p class="muted">Últimos movimientos sincronizados.</p>${table([...ingresos].reverse().slice(0,25),[['Fecha',r=>esc((r.fecha||'').slice(0,10))],['Tipo',()=>'<b>INGRESO</b>'],['Código',r=>esc(r.codigo)],['Cantidad',r=>num(r.cantidad)],['Guía',r=>esc(r.guia)]])}<br>${table([...salidas].reverse().slice(0,25),[['Fecha',r=>esc((r.fecha||'').slice(0,10))],['Tipo',()=>'<b>SALIDA</b>'],['Código',r=>esc(r.codigo)],['Cantidad',r=>num(r.cantidad)],['Nota',r=>esc(r.nota)]])}</div>`}function formIn(){return `<div class="panel"><h2>Registrar ingreso</h2><p class="muted">Se guarda en la base de datos.</p><form onsubmit="CM.addIn(event)">${field('Código del bien','codigo','','text','required list="codes"')}<datalist id="codes">${opts()}</datalist><div class="tw">${field('Cantidad','cantidad','','number','min="0.01" step="any" required')}${field('Proyecto','proyecto','2830.06')}</div><div class="tw">${field('Fecha recepción','fecha',new Date().toISOString().slice(0,10),'date')}${field('Guía de remisión','guia')}</div><div class="tw">${field('Número pedido','pedido')}${field('Número orden','orden')}</div><div class="tw">${field('Área que solicita','area','ALMACEN')}${field('Ubicación','ubicacion','ALMACEN NORTE')}</div><div class="form-actions"><button class="primary">Guardar ingreso</button></div></form></div>`}function formOut(sm){return `<div class="panel"><h2>Registrar salida</h2><p class="muted">La salida no puede superar el stock disponible.</p><form onsubmit="CM.addOut(event)">${field('Código del bien','codigo','','text','required list="codes2"')}<datalist id="codes2">${opts()}</datalist><div class="tw">${field('Cantidad solicitada','cantidad','','number','min="0.01" step="any" required')}${field('Proyecto','proyecto','2830.06')}</div><div class="tw">${field('Fecha despacho','fecha',new Date().toISOString().slice(0,10),'date')}${field('Nota de salida','nota')}</div><div class="tw">${field('Solicitante','solicitante')}${field('Entregado a','entregado')}</div><div class="tw">${field('Autorizante','autorizante')}${field('Criterio','criterio','4','number')}</div>${field('Destino / Actividad','destino')}<div class="form-actions"><button class="primary">Guardar salida</button></div></form></div>`}function render(){if(recoveryMode){document.getElementById('root').innerHTML=`<div class="login"><div class="login-card"><div class="logo">CM</div><h1>Nueva contraseña</h1><p>Escribe una nueva contraseña para tu cuenta.</p><div id="recoveryMsg"></div><form onsubmit="CM.updatePassword(event)">${field('Nueva contraseña','password','','password','required minlength="6"')}${field('Repetir contraseña','password2','','password','required minlength="6"')}<button class="primary" style="width:100%;margin-top:15px">Guardar contraseña</button></form></div></div>`;return}if(!user){document.getElementById('root').innerHTML=`<div class="login"><div class="login-card"><div class="logo">CM</div><h1>Control de Materiales</h1><p>Accede para consultar y registrar movimientos.</p><div id="loginMsg"></div><form onsubmit="CM.login(event)">${field('Correo electrónico','email','','email','required')}${field('Contraseña','password','','password','required minlength="6"')}<div class="login-actions"><button class="primary">Iniciar sesión</button><button class="secondary" type="button" onclick="CM.signup(event)">Crear cuenta</button></div><button type="button" class="secondary" style="width:100%;margin-top:10px" onclick="CM.forgot(event)">¿Olvidaste tu contraseña?</button></form><p class="muted" style="font-size:12px;margin-top:18px">La cuenta queda protegida por Supabase Auth.</p></div></div>`;return}const title={dashboard:'Panel',inventory:'Inventario',in:'Ingresos',out:'Salidas',catalog:'Materiales',reports:'Reportes'}[view];document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">CM</div><div><b>Control de</b><strong>Materiales</strong></div></div><nav class="nav">${nav()}</nav><div class="userbox">${esc(user.email)}<br><button class="secondary" style="margin-top:8px;padding:7px 10px" onclick="CM.logout()">Cerrar sesión</button></div><div class="sidefoot">Aplicación web V2<br><b>Inventario · Ingresos · Salidas</b></div></aside><main class="main"><div class="top"><div><h1>${title}</h1><p>Inventario · Ingresos · Salidas · Reportes</p></div><div class="badge">● Conectado</div></div>${notice?`<div class="toast">${esc(notice)}</div>`:''}${content()}</main></div>`}async function load(){loading=true;const [i,o]=await Promise.all([supabase.from('materiales_ingresos').select('*').order('id',{ascending:true}),supabase.from('materiales_salidas').select('*').order('id',{ascending:true})]);if(i.error||o.error){notice=(i.error||o.error).message;loading=false;render();return}ingresos=i.data.map(x=>({id:x.id,cantidad:x.cantidad,codigo:x.codigo_bien,unidad:catalog(x.codigo_bien).unidad,descripcion:catalog(x.codigo_bien).descripcion,pedido:x.numero_pedido,orden:x.numero_orden,guia:x.guia_remision,fecha:x.fecha_recepcion,proyecto:x.codigo_proyecto,area:x.area_solicita,ubicacion:x.ubicacion}));salidas=o.data.map(x=>({id:x.id,proyecto:x.codigo_proyecto,codigo:x.codigo_bien,unidad:catalog(x.codigo_bien).unidad,descripcion:catalog(x.codigo_bien).descripcion,cantidad:x.cantidad_solicitada,nota:x.nota_salida,fecha:x.fecha_despacho,solicitante:x.solicitante,entregado:x.entregado_a,autorizante:x.autorizante,destino:x.destino_actividad,criterio:x.criterio}));loading=false;render()}function msg(t,err=false){notice=t;render()}window.CM={async login(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const {data,error}=await supabase.auth.signInWithPassword({email:f.email,password:f.password});if(error){document.getElementById('loginMsg').innerHTML=`<div class="toast err">${esc(error.message)}</div>`;return}user=data.user;notice='Sesión iniciada.';await load()},async forgot(e){e.preventDefault();const form=e.target.closest('form');const f=Object.fromEntries(new FormData(form));if(!f.email){document.getElementById('loginMsg').innerHTML='<div class="toast err">Escribe primero tu correo electrónico.</div>';return}const redirectTo=window.location.origin+window.location.pathname;const {error}=await supabase.auth.resetPasswordForEmail(f.email,{redirectTo});document.getElementById('loginMsg').innerHTML=error?`<div class="toast err">${esc(error.message)}</div>`:'<div class="toast">Te enviamos un correo para restablecer tu contraseña. Revisa también spam.</div>'},async updatePassword(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.password!==f.password2){document.getElementById('recoveryMsg').innerHTML='<div class="toast err">Las contraseñas no coinciden.</div>';return}const {error}=await supabase.auth.updateUser({password:f.password});if(error){document.getElementById('recoveryMsg').innerHTML=`<div class="toast err">${esc(error.message)}</div>`;return}recoveryMode=false;notice='Contraseña actualizada. Ya puedes iniciar sesión.';await supabase.auth.signOut();user=null;render()},async signup(e){e.preventDefault();const form=e.target.closest('form');const f=Object.fromEntries(new FormData(form));const {data,error}=await supabase.auth.signUp({email:f.email,password:f.password});if(error){document.getElementById('loginMsg').innerHTML=`<div class="toast err">${esc(error.message)}</div>`;return}document.getElementById('loginMsg').innerHTML=`<div class="toast">Cuenta creada. Si se solicita, confirma tu correo y luego inicia sesión.</div>`},async logout(){await supabase.auth.signOut();user=null;render()},async go(v){view=v;q='';notice='';render()},search(v){q=v;render()},async addIn(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.cantidad=Number(f.cantidad);const c=catalog(f.codigo);const {error}=await supabase.from('materiales_ingresos').insert({cantidad:f.cantidad,codigo_bien:f.codigo,numero_pedido:f.pedido||null,numero_orden:f.orden||null,guia_remision:f.guia||null,fecha_recepcion:f.fecha||null,codigo_proyecto:f.proyecto?Number(f.proyecto):null,nombre_proyecto:null,area_solicita:f.area||null,modo_envio:null,ubicacion:f.ubicacion||null,estado_liberacion:null});if(error){msg(error.message,true);return}notice='Ingreso registrado y sincronizado.';await load();view='inventory';render()},async addOut(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.cantidad=Number(f.cantidad);const sm=stockMap(),disponible=sm[f.codigo]||0;if(f.cantidad>disponible){msg('Stock insuficiente. Disponible: '+num(disponible),true);return}const {error}=await supabase.from('materiales_salidas').insert({codigo_proyecto:f.proyecto?Number(f.proyecto):null,codigo_bien:f.codigo,cantidad_solicitada:f.cantidad,nota_salida:f.nota||null,fecha_despacho:f.fecha||null,solicitante:f.solicitante||null,entregado_a:f.entregado||null,autorizante:f.autorizante||null,destino_actividad:f.destino||null,criterio:f.criterio?Number(f.criterio):null});if(error){msg(error.message,true);return}notice='Salida registrada y sincronizada.';await load();view='inventory';render()}};
(async()=>{const {data}=await supabase.auth.getSession();user=data.session?.user||null;if(user)await load();else render();supabase.auth.onAuthStateChange((event,s)=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;user=null;render();return}user=s?.user||null;if(user){recoveryMode=false;load()}else render()})})();
})();</script></body></html>
